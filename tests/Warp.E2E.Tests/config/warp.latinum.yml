# Warp.Latinum configuration for the E2E suite.
#
# Latinum hosts the Stripe webhook controller. The tests craft HMAC-signed events with the
# KNOWN signing secret below and POST them straight to /stripe/payment and /stripe/subscription,
# so signature verification is exercised end to end (a bogus signature is rejected 400).

$include:
  - datacontext.yml

Kestrel:
  Endpoints:
    Internal:
      Url: "http://0.0.0.0:5004"

JobContext:
  ConnectionString: "${REDIS_CONNECTION_STRING:redis:6379,defaultDatabase=0}"
  Channel: "stripe_payment_async"

Controllers:
  - Type: "Warp.Latinum.Controllers.StripeWebhookController, warp.latinum"
    Options:
      Plans:
        $include: stripe-plans.yml

      # Payment middleware options are shared by the controller (channel, key headers, Stripe base).
      ConnectionString: "${REDIS_CONNECTION_STRING:redis:6379,defaultDatabase=0}"
      Channel: "stripe_payment_async"
      NgrokAuthToken: "${NGROK_AUTH_TOKEN:}"
      StripeSecretKey: "${STRIPE_SECRET_KEY:sk_test_e2e}"
      StripeApiBase: "${STRIPE_API_BASE:http://localstripe:8420}"
      # RELEASE builds register the payment webhook endpoint in localstripe using this URL.
      # Any auto-delivered events carry localstripe's own per-endpoint secret and are rejected
      # (wrong signature) — the tests drive grants via their own signed posts with the secret below.
      CallbackUrl: "${STRIPE_PAYMENT_CALLBACK_URL:http://warp-latinum:5004/stripe/payment}"
      KeyHeaders:
        - "X-JWT-Email"
        - "X-Api-Key"

      WebhookUrl: "${STRIPE_SUBSCRIPTION_WEBHOOK_URL:}"
      StripePublishableKey: "${STRIPE_PUBLISHABLE_KEY:pk_test_e2e}"

      # --- Webhook signature verification (fail-closed) ---
      VerifySignature: true
      WebhookSecret: "${STRIPE_WEBHOOK_SECRET:whsec_e2e_0123456789abcdef0123456789abcdef}"
      PaymentWebhookSecret: "${STRIPE_PAYMENT_WEBHOOK_SECRET:}"
      SubscriptionWebhookSecret: "${STRIPE_SUBSCRIPTION_WEBHOOK_SECRET:}"
      SignatureToleranceSeconds: 300
      AllowUnverifiedWebhooksInsecure: false
