# Warp.Latinum Configuration for Monetization Example

$include: 
  - datacontext.yml
  - opentelemetry.yml

Kestrel:
  Endpoints:
    Internal:
      Url: "http://0.0.0.0:5004"

# Job context configuration for webhook processing
JobContext:
  ConnectionString: "${REDIS_CONNECTION_STRING:redis:6379,defaultDatabase=0}"
  Channel: "stripe_payment_async" # Default channel, webhooks will look in both payment and subscription channels

# Controllers to register
Controllers:
  - Type: "Warp.Latinum.Controllers.StripeWebhookController, warp.latinum"
    Options:
      # Subscription plans configuration (from shared file)
      Plans:
        $include: stripe-plans.yml

      # Payment webhook configuration
      NgrokAuthToken: "${NGROK_AUTH_TOKEN:}"
      StripeSecretKey: "${STRIPE_SECRET_KEY:}"
      KeyHeaders: 
        - "X-JWT-Email"
        - "X-Api-Key"      

      # Subscription webhook configuration (for controller attribute)
      WebhookUrl: "${STRIPE_SUBSCRIPTION_WEBHOOK_URL:}"
      StripePublishableKey: "${STRIPE_PUBLISHABLE_KEY:}"

      # --- Webhook signature verification ---
      # Inbound Stripe webhooks are verified against the signing secret using the Stripe-Signature
      # header. Verification is REQUIRED by default; requests that fail (or a missing secret) are
      # rejected with 400/500 (fail closed).
      VerifySignature: true
      # Shared/default signing secret; used for both endpoints unless a per-endpoint secret is set.
      WebhookSecret: "${STRIPE_WEBHOOK_SECRET:}"
      # Optional per-endpoint secrets when the payment and subscription webhooks use different secrets.
      PaymentWebhookSecret: "${STRIPE_PAYMENT_WEBHOOK_SECRET:}"
      SubscriptionWebhookSecret: "${STRIPE_SUBSCRIPTION_WEBHOOK_SECRET:}"
      # Allowed timestamp tolerance (seconds) for the signature. Default: 300.
      SignatureToleranceSeconds: 300
      # DANGER / dev-only escape hatch: when true, webhooks are processed WITHOUT signature
      # verification. Off by default and must never be enabled in production.
      AllowUnverifiedWebhooksInsecure: false
