$include: datacontext.yml # Use an include to share configuration definitions between multiple files

ReverseProxy:
  Clusters:
    # All our API clusters are defined here.

    # Developer API cluster for managing API keys and user information.
    developer_api_cluster:
      Destinations:
        developer:
          Address: "http://127.0.0.1:5002/"

    # Admin API cluster for managing users, permissions and quotas.
    admin_api_cluster:
      Destinations:
        admin:
          Address: "http://127.0.0.1:5003/"


    # Cluster that forwards requests to the MemoryAlpha RAG API service.
    memoryalpha_cluster:
      Destinations:
        memoryalpha: # Only a single destination in this cluster.
          # We can use an environment variable to configure the service address
          Address: ${MEMORYALPHA_RAG_API_ADDR}          

  Routes:

    # Expose our Developer API for managing API keys and users.
    developer:
      ClusterId: "developer_api_cluster" # Route to the Developer API cluster.
      Match:
        Path: "/developer/{**remainder}" # All paths under /developer are routed to the Developer API.
      Metadata:
        Preprocess:
          - Type: "Warp.Dilithium.Middleware.PermissionsChecker, warp.dilithium"
            Options:
              RequiredPermissions:
                - "developer"
              CreateUserIfNotFound: true # Create user if not found.
              DefaultPermissions: # Set Default permissions for new users.
                - "developer"
                - "user"
        Predispatch: # Middleware to validate requests against the Developer API OpenAPI spec.
          - Type: "Warp.Dilithium.Middleware.OpenApiValidator, warp.dilithium"
            Options:
              SpecFile: "spec/warp.apis.developer.yml"

    # Expose our Admin API for managing users, permissions and quotas.
    admin:
      ClusterId: "admin_api_cluster" # Route to the Admin API cluster.
      Match:
        Path: "/admin/{**remainder}" # All paths under /admin are routed to the Admin API.
      Metadata:
        Preprocess:
          - Type: "Warp.Dilithium.Middleware.PermissionsChecker, warp.dilithium"
            Options:
              RequiredPermissions:
                - "admin"
              CreateUserIfNotFound: false # Users must be manually created first
              DefaultPermissions: # Set Default permissions for new users.
                - "admin"
        Predispatch: # Middleware to validate requests against the Admin API OpenAPI spec.
          - Type: "Warp.Dilithium.Middleware.OpenApiValidator, warp.dilithium"
            Options:
              SpecFile: "spec/warp.apis.admin.yml"

    # Free API route with prepaid quota
    memoryalpha_free:
      ClusterId: "memoryalpha_cluster" # Route to the MemoryAlpha cluster.
      Match:
        Path: "/examples/quotas/free/{**catch-all}" # Non-canonical API path so we can proxy the same service under different routes.
      Transforms:
        - PathRemovePrefix: "/examples" # Remove the /examples prefix before forwarding.
        - PathRemovePrefix: "/quotas" # Remove the /quotas prefix before forwarding.
        - PathRemovePrefix: "/free" # Remove the /free prefix before forwarding.
      Metadata: # Middleware configuration for this route.
        
        # This section runs when the request first arrives and is matched to this route.
        Preprocess:
          # This middleware rate-limits requests to 1 per second for free users.
          - Type: "Warp.Dilithium.Middleware.RateLimiter, warp.dilithium"
            Options:
              RateLimitHz: 1.0

          # This middleware validates API keys for users. We can obtain API keys from the Developer API.
          - Type: "Warp.Dilithium.Middleware.ApiKeyValidator, warp.dilithium"

          # This middleware ensures that free API users do not exceed their quotas.
          # Quota is tracked per user and when the quota is exceeded, requests are rejected.
          - Type: "Warp.Dilithium.Middleware.QuotaChecker, warp.dilithium"
            Options:
              QuotaName: "free_quota"
              QuotaUsage: 1.0 # Each request uses 1.0 units of the quota
              QuotaType: "prepaid" # Prepaid quota type means we set a fixed quota and decrement it
              DefaultQuota: 10.0 # Default quota for new users (Total requests allowed until reset)

        Predispatch:
          # This section runs after transforms have been applied but before the request is sent to the destination.
          # Here, we will have the canonical path and headers.

          # This middleware validates requests against the OpenAPI spec for this API.
          - Type: "Warp.Dilithium.Middleware.OpenApiValidator, warp.dilithium"
            Options:
              # We can use a uri to load the spec from a remote location, or even from the API itself if it serves its own spec.
              SpecUri: https://github.com/aniongithub/memoryalpha-rag-api/releases/download/${MEMORYALPHA_RAG_API_VERSION}/memoryalpha-rag-api-spec.json

        Postdispatch:
          # This section runs after the response is received from the destination but before it is sent to the client.
          # Here, we can inspect the response and update quotas or perform instrumentation/logging.

          # This middleware extracts usage information from JSON responses and adds it as headers.
          # For example, if an API returns {"tokens_used": 150}, this can extract that value.
          - Type: "Warp.Dilithium.Middleware.JsonResponseToHeaderTransform, warp.dilithium"
            Options:
              Mappings:
                - JqSelector: ".token_usage.total_tokens"
                  DestinationHeader: "X-Quota-Usage"

          # This middleware updates the used quota for free users after each successful request.
          # This ensures that the quota is decremented only for successful requests and can be tracked
          # correctly for variable usage-based billing.
          - Type: "Warp.Dilithium.Middleware.QuotaUpdater, warp.dilithium"
            Options:
              UsageHeader: "X-Quota-Usage" # Our API can return the actual usage in this header (defaults to 1.0 if not present)