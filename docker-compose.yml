services:

  warp:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file:
      - .env
      - .env.local
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5000

      - RUN_WARP=true
      - RUN_PLASMA=true
    ports:
      - "5000:5000"
      - "5001:5001"
    volumes:
      - ./config:/workspace/warp/config
      - ./data:/workspace/warp/data
      - ./logs:/workspace/warp/logs
      - ./uploads:/uploads
    working_dir: /workspace/warp
    depends_on:
      - otel-collector

      # Enable any backends you need here
      # - postgres
      # - firestore
      - redis
    networks:
      - warp-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"  # OTLP gRPC
      - "8889:8889"  # Prometheus metrics
    depends_on:
      - jaeger
    networks:
      - warp-network

  jaeger:
    image: jaegertracing/opentelemetry-all-in-one:latest
    ports:
      - "16686:16686"  # Jaeger UI
    networks:
      - warp-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - warp-network
  
  # Enable any data storage backends you need here
  # postgres:
  #   image: postgres:16.4
  #   user: "1000:1000"
  #   environment:
  #     POSTGRES_DB: warp
  #     POSTGRES_USER: warp
  #     POSTGRES_PASSWORD: warp_dev_password
  #     PGUSER: vscode
  #   volumes:
  #     - ../data/postgres:/var/lib/postgresql/data
  #   networks:
  #     - warp-network

  # firestore:
  #   build:
  #     context: .
  #     dockerfile: firestore.Dockerfile
  #   ports:
  #     - "8080:8080"  # Firestore emulator UI
  #     - "4000:4000"  # Firestore Web UI
  #   networks:
  #     - warp-network

  memoryalpha-rag-api:
    image: aniondocker/memoryalpha-rag-api:${MEMORYALPHA_RAG_API_VERSION}
    ports:
      - "8000:8000"
    networks:
      - warp-network
    depends_on:
      - ollama
    environment:
      DEFAULT_MODEL: qwen3:0.6b
      DEFAULT_IMAGE_MODEL: qwen2.5vl:3b
      OLLAMA_URL: http://ollama:11434
      DB_PATH: /data/enmemoryalpha_db
    volumes:
      - rag-cache:/root/.cache

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - warp-network
    environment:
      DEFAULT_MODEL: qwen3:0.6b
      DEFAULT_IMAGE_MODEL: qwen2.5vl:3b      
    entrypoint: >
      sh -c '
        ollama serve &
        sleep 5
        ollama pull $$DEFAULT_MODEL
        ollama pull $$DEFAULT_IMAGE_MODEL
        wait
      '

  stripe-mock:
    image: stripemock/stripe-mock:latest
    ports:
      - "12111:12111"
    networks:
      - warp-network
    environment:
      # Configure stripe-mock to send webhooks to our controller
      - STRIPE_WEBHOOK_SECRET=whsec_test_secret
      # Note: stripe-mock sends webhooks to all URLs in STRIPE_WEBHOOK_ENDPOINTS (space-separated)
      # We'll configure this to point to warp.latinum on internal port 5004
      - STRIPE_WEBHOOK_ENDPOINTS=http://warp:5004/stripe/payment
    
networks:
  warp-network:
    driver: bridge

volumes:
  rag-cache:
  ollama-data: