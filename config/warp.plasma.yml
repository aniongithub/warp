# Warp Plasma Job Processor Configuration

# Job processing engine configuration
PollingIntervalMs: 2000
MaxConcurrentJobs: 10  # Maximum number of jobs to process concurrently

# Timeouts for idle and HTTP requests, 15 mins (use -1 for infinite)
IdleTimeoutMs: 900000
HttpTimeoutMs: 900000

# Redis connection settings
Redis:
  ConnectionString: "redis:6379"
  Database: 0
  Channel: "memoryalpha"

# Target API endpoint for job execution
Endpoint: "http://memoryalpha-rag-api:8000"

# Job processor behavior
Processor:
  EnableHealthCheck: true
  HealthCheckIntervalMs: 30000
  RetryFailedJobs: true
  MaxRetryAttempts: 3
  RetryDelayMs: 10000
