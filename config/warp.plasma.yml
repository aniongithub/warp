# Warp Plasma Job Processor Configuration

# Multi-consumer job configurations (new multi-consumer pattern)
Jobs:
  memoryalpha:
    MaxConcurrentJobs: 3
    PollingIntervalMs: 2000
    Context:
      Type: "Warp.Core.Job.Contexts.RedisJobContext, warp.core"
      Options:
        ConnectionString: "redis:6379"
        Database: 0
        Channel: "MemoryAlpha"
    Delivery:
      Type: "Warp.Core.Job.Delivery.WebhookResultDelivery, warp.core"
      Options:
        WebhookUrl: "https://api.example.com/webhooks/memoryalpha"
        TimeoutSeconds: 30
        MaxRetries: 3
        RetryDelaySeconds: 5
        Headers:
          Authorization: "Bearer YOUR_API_TOKEN"
          X-Source: "warp-plasma"

  other_service:
    MaxConcurrentJobs: 5
    PollingIntervalMs: 5000
    Context:
      Type: "Warp.Core.Job.Contexts.RedisJobContext, warp.core"
      Options:
        ConnectionString: "redis:6379"
        Database: 0
        Channel: "OtherService"
    # No Delivery section = polling only

# Legacy configuration (fallback when Jobs section is not configured)
# Job processing engine configuration
PollingIntervalMs: 2000
MaxConcurrentJobs: 10  # Maximum number of jobs to process concurrently

# Timeouts for idle and HTTP requests, 15 mins (use -1 for infinite)
IdleTimeoutMs: 900000
HttpTimeoutMs: 900000

# Redis connection settings
Redis:
  ConnectionString: "redis:6379"
  Database: 0
  Channel: "memoryalpha_async"

# Target API endpoint for job execution
Endpoint: "http://memoryalpha-rag-api:8000"

# Job processor behavior
Processor:
  EnableHealthCheck: true
  HealthCheckIntervalMs: 30000
  RetryFailedJobs: true
  MaxRetryAttempts: 3
  RetryDelayMs: 10000
