# Warp Gateway Configuration
$include: 
  - "shared/${DATACONTEXT_IMPL}-datacontext.yml"
  - "shared/opentelemetry.yml"

# CORS Configuration (optional - only include if cross-origin requests are needed)
# Cors:
#   AllowedOrigins:
#     - "http://localhost:3030"
#     - "https://yourdomain.com"
#   AllowedMethods:
#     - "GET"
#     - "POST"
#     - "PUT"
#     - "DELETE"
#   AllowedHeaders:
#     - "Content-Type"
#     - "Authorization"
#     - "X-API-Key"
#   AllowCredentials: true

ReverseProxy:
  Clusters:
    admin_api_cluster:
      Destinations:
        admin:
          Address: "http://127.0.0.1:5003/"
    developer_api_cluster:
      Destinations:
        developer:
          Address: "http://127.0.0.1:5002/"
    memoryalpha_cluster:
      Destinations:
        memoryalpha:
          Address: "http://memoryalpha-rag-api:8000"
  
  Routes:
    $include: 
      - "routes/admin.yml"
      - "routes/developer.yml"
      - "routes/basic/memoryalpha.yml"
      - "routes/pro/memoryalpha.yml"

Kestrel:
  Endpoints:
    Public:
      Url: "http://*:5000"

